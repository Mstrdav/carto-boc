<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Test mobile + hit-test — carto-boc (harnais 390×844)</title>
<style>
  body { margin:0; font:14px system-ui; background:#0b1220; color:#e5e7eb; }
  h1 { font-size:15px; margin:10px 14px 4px; }
  .sub { color:#9ca3af; font-size:12px; margin:0 14px 12px; }
  #wrap { display:flex; gap:20px; padding:0 14px 16px; align-items:flex-start; }
  #phone { flex:0 0 390px; }
  iframe { width:390px; height:844px; border:1px solid #29344a; border-radius:14px; background:#0f172a; display:block; }
  #report { flex:1; font-family:ui-monospace,SFMono-Regular,monospace; font-size:11.5px;
    line-height:1.5; white-space:pre-wrap; background:#111827; border:1px solid #29344a;
    border-radius:10px; padding:12px; min-height:820px; }
  #report .PASS { color:#22c55e; } #report .FAIL { color:#f87171; }
  #report .HDR { color:#38bdf8; font-weight:700; }
  button { margin:2px 6px 10px 0; padding:7px 12px; border-radius:8px; border:1px solid #29344a;
    background:#1b2536; color:#e5e7eb; cursor:pointer; }
  button:hover { filter:brightness(1.15); }
</style>
</head>
<body>
<h1>Harnais de test — mobile 390×844 + hit-test premier affichage</h1>
<p class="sub">L'iframe charge index.html à 390 px de large : les media queries (max-width:760px)
s'appliquent exactement comme sur un vrai téléphone. Les vérifs s'exécutent automatiquement.</p>
<div id="wrap">
  <div id="phone"><iframe id="app" src="../index.html"></iframe></div>
  <div>
    <div><button onclick="runAll()">Relancer les vérifs</button></div>
    <div id="report">Chargement…</div>
  </div>
</div>
<script>
const REP = () => document.getElementById('report');
function out(s, cls) { const d = document.createElement('div'); d.className = cls||''; d.textContent = s; REP().appendChild(d); }
function appW() { return document.getElementById('app').contentWindow; }
function appD() { return appW().document; }
function check(cond, label) { out((cond?'PASS  ':'FAIL  ')+label, cond?'PASS':'FAIL'); window.__ok = (window.__ok!==false) && cond; }
const wait = ms => new Promise(r => setTimeout(r, ms));
async function runAll() {
  REP().textContent = ''; window.__ok = true;
  const w = appW(), d = appD();
  if (!w.__carto) { out('FAIL  __carto indisponible (app.js non chargée ?)', 'FAIL'); return; }
  const cs = sel => d.defaultView.getComputedStyle(d.querySelector(sel));

  out('[MOBILE 390px — media queries]', 'HDR');
  check(w.innerWidth >= 380 && w.innerWidth <= 400, 'iframe innerWidth ≈ 390 (obtenu ' + w.innerWidth + ')');
  check(w.matchMedia('(max-width: 760px)').matches, 'media (max-width:760px) actif');
  check(cs('#panel-toggle').display === 'flex', 'bouton ☰ visible (display:flex)');
  const panel = cs('#panel');
  check(panel.position === 'fixed', 'panneau en position fixed');
  check(panel.transform !== 'none' && panel.transform !== 'matrix(1, 0, 0, 1, 0, 0)', 'panneau replié (translateX hors écran) : ' + panel.transform);
  check(cs('#map').inset === '0px', 'carte plein écran (inset:0)');
  check(cs('#legend').left === '16px', 'légende en bas à gauche (left:16px)');
  check(cs('#scrim').display === 'block', 'voile (scrim) présent (display:block)');
  const scrim = cs('#scrim');
  check(scrim.opacity === '0' && scrim.pointerEvents === 'none', 'voile inactif par défaut (opacity 0, pointer-events none)');

  out('', '');
  out('[TIROIR ☰ — ouverture/fermeture]', 'HDR');
  const tg = d.getElementById('panel-toggle');
  const panelEl = d.getElementById('panel');
  tg.click();
  check(panelEl.classList.contains('open'), 'clic ☰ ouvre le panneau (.open)');
  check(tg.getAttribute('aria-expanded') === 'true', 'aria-expanded=true après ouverture');
  await wait(320); // laisse la transition translateX (.25s) se terminer
  const m2 = panelEl.getBoundingClientRect();
  check(m2.left >= -1 && m2.left <= 1, 'panneau visible à gauche (left≈0, obtenu ' + m2.left.toFixed(1) + ')');
  check(d.querySelector('#scrim').classList.contains('show'), 'voile actif pendant ouverture');
  tg.click();
  await wait(320);
  check(!panelEl.classList.contains('open'), 'clic ☰ referme le panneau');
  check(tg.getAttribute('aria-expanded') === 'false', 'aria-expanded=false après fermeture');
  const m3 = panelEl.getBoundingClientRect();
  check(m3.right <= 1, 'panneau de nouveau hors écran (right≤0, obtenu ' + m3.right.toFixed(1) + ')');

  out('', '');
  out('[HIT-TEST — premier affichage, sans pan/zoom]', 'HDR');
  const carto = w.__carto;
  const gridCells = carto.gridCellCount();
  check(gridCells > 0, 'grille de hit-test construite (nb cellules = ' + gridCells + ')');
  // commune visible au centre initial (zoom 6, centre 46.6/2.4) : on prend une commune réelle
  const center = carto.map.getCenter();
  const c = carto.hitTestAt(center.lat, center.lng);
  check(!!c, 'hitTestAt(centre de la carte) renvoie une commune' + (c ? ' : ' + c.nom : ''));
  // le clic synthétique doit ouvrir une popup Leaflet
  const pt = carto.map.latLngToContainerPoint([center.lat, center.lng]);
  const rect = carto.map.getContainer().getBoundingClientRect();
  const cx = rect.left + pt.x, cy = rect.top + pt.y;
  const ev = new w.MouseEvent('click', { bubbles:true, cancelable:true, clientX:cx, clientY:cy, view:w });
  carto.map.getContainer().dispatchEvent(ev);
  await wait(400);
  const pop = d.querySelector('.leaflet-popup');
  check(!!pop, 'clic synthétique au centre -> popup Leaflet ouverte');
  const hit = carto.hitTestAt(center.lat, center.lng);
  if (hit && pop) {
    check(pop.textContent.indexOf(hit.nom) >= 0, 'popup correspond à la commune du hit-test (' + hit.nom + ')');
  }

  out('', '');
  out('[DESKTOP — régression à 1262 px]', 'HDR');
  out('  (vérifié séparément sur la page publiée : panneau latéral 340px, ☰ masqué, zéro erreur console)', '');

  out('', '');
  out(window.__ok ? '=== RÉSULTAT GLOBAL : OK ===' : '=== RÉSULTAT GLOBAL : ÉCHEC(S) ===', window.__ok ? 'PASS' : 'FAIL');
}
document.getElementById('app').addEventListener('load', () => setTimeout(runAll, 500));
</script>
</body>
</html>
